name: ci
# The required status check. Two jobs it has to do:
#
#   1. Be an independent gate. pr-review is an agent judging its own sibling's
#      work; this is a deterministic check that does not negotiate.
#   2. Exist at all, so branch protection has something to require. With an empty
#      required-checks list, the auto-merge that implement-story arms fires the
#      instant the PR opens — before any review has run.
#
# Keep this fast and boring. Deep verification belongs to pr-review.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not just the PR's tip commit — gitleaks scans commit
          # history, and a secret introduced then "removed" in a later commit
          # is still leaked unless the whole history is scanned.
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/gitleaks" gitleaks
          # Without --log-opts, gitleaks walks every ref it can see, not just this
          # branch's own history. fetch-depth: 0 pulls every remote branch into
          # refs/remotes/origin/*, so that default scans sibling branches too — a
          # secret sitting in another open PR fails *this* PR's check, and it's
          # scanned against this branch's .gitleaks.toml, which may not have that
          # branch's own allowlist fix. Scope to HEAD: still this branch's full
          # history (the reason fetch-depth: 0 is set above), never anyone else's.
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner --no-color --log-opts="HEAD"

      - id: setup
        uses: ./.github/actions/setup-project

      - name: Validate the pipeline state file
        run: |
          # Cheap, and it catches a dependsOn cycle or a malformed record here
          # rather than as a mystery "no eligible story" three workflows later.
          if [ -f stories.json ]; then
            node .github/scripts/validate-stories.mjs
          fi

      - name: Typecheck, lint, build, test
        env:
          TYPECHECK: ${{ steps.setup.outputs.cmd_typecheck }}
          LINT: ${{ steps.setup.outputs.cmd_lint }}
          BUILD: ${{ steps.setup.outputs.cmd_build }}
          # setup-project's "Start local services" step already ran the manifest's
          # `services` command (`npx supabase start`) before this step, so TEST runs
          # against a live local Postgres on the Supabase CLI's fixed local port —
          # the same connection string docs/testing.md's Worker/API integration tier
          # and this repo's demo scripts (e.g. scripts/demo-us-002.sh) use.
          TEST: ${{ steps.setup.outputs.cmd_test }}
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -uo pipefail
          if [ "${{ steps.setup.outputs.scaffolded }}" != "true" ]; then
            echo "Project not scaffolded yet — nothing to check."
            exit 0
          fi
          # Whatever the manifest declares, in whatever language. A project that
          # has no separate typecheck, lint, build, or test step leaves it empty
          # rather than failing on its absence.
          failed=0
          for name in TYPECHECK LINT BUILD TEST; do
            cmd="${!name}"
            if [ -z "$cmd" ]; then
              echo "No $name command declared — skipping."
              continue
            fi
            echo "::group::$name: $cmd"
            if ! eval "$cmd"; then
              echo "::error::$name failed: $cmd"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
