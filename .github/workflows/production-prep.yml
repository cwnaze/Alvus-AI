name: production-prep
on:
  workflow_dispatch:
  repository_dispatch:
    types: [production-prep]

concurrency:
  group: story-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  security-events: read

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_PAT }}
      - uses: ./.github/actions/setup-project
        with:
          playwright: 'true'
      - name: Materialize .env from repo secrets
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: node .github/scripts/write-env.mjs
      - name: Loosen auth rate limits for the regression suite
        # See pr-review.yml's identical step -- AUTH_RATE_LIMIT_*_MAX default tight
        # in production; this job also runs the full Playwright regression suite
        # and needs its own headroom instead.
        run: |
          cat >> .env <<'EOF'
          AUTH_RATE_LIMIT_SIGNUP_MAX=50
          AUTH_RATE_LIMIT_LOGIN_MAX=150
          AUTH_RATE_LIMIT_PASSWORD_RESET_REQUEST_MAX=30
          EOF
      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.PIPELINE_PAT }}
          prompt: /production-prep
          # See story-start.yml: default action permissions have no Bash access.
          claude_args: --max-turns 200 --allowedTools "Bash,Edit,Write,Glob,Grep"
